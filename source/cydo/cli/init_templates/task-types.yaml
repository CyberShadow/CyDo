#       after_quality_review:
#         task_type: review
#         requires_approval: true
#         keep_context: false
#         worktree: inherit
#         prompt_template: prompts/review.md
#         description: Request an independent follow-up review.
#     on_yield:
#       task_type: review
#       requires_approval: true
#       keep_context: false
#       worktree: require
