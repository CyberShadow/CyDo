## cydo-init: complete-example end

## ===========================================================================
## User entry points
## ===========================================================================

## user_entry_points
## Purpose: Provides the named new-task selections.
## Type: Mapping from entry labels to entry settings.
## Default: Retains entries from lower layers.
## Accepted values: A key must not match a singleton name, even if disabled.
## Notes: CyDo creates a hidden system entry for each enabled singleton.
# user_entry_points:
#   research_console:
#     description: Discuss a research question.
#     prompt_template: prompts/blank.md

## ---------------------------------------------------------------------------
## Entry-point fields
## ---------------------------------------------------------------------------

## task_type
## Purpose: Selects which task type to start.
## Type: Type name string.
## Default: Uses the entry-point key when omitted.
# user_entry_points:
#   start_research:
#     task_type: research_console

## description
## Purpose: Supplies the description in the task picker. The key is the label.
## Type: String.
## Default: Required. May be empty for a system entry.
# user_entry_points:
#   start_research:
#     description: Discuss a research question.

## prompt_template
## Purpose: Wraps the first message when this entry starts.
## Type: Path string relative to defs.
## Default: Required for every entry, including system entries.
## Notes: Receives task_description, knowledge_base when set, and
##   output_file and output_dir when an output path is supplied.
# user_entry_points:
#   start_research:
#     prompt_template: prompts/blank.md

## worktree
## Purpose: Controls worktree placement for the root task.
## Type: Worktree mode string.
## Default: inherit. The root task stays in the checkout.
## Accepted values: inherit, require, fork.
## Notes: require requests a shared root-task worktree. fork requests a
##   task-owned worktree. Git allocation can fail.
# user_entry_points:
#   start_research:
#     worktree: inherit

## system
## Purpose: Hides the entry from the user-facing task picker.
## Type: Boolean.
## Default: False.
# user_entry_points:
#   start_research:
#     system: false

## ---------------------------------------------------------------------------
## Complete example
## ---------------------------------------------------------------------------

## The research_console entry omits task_type and resolves to the type of the
## same name.

## cydo-init: complete-example begin
# user_entry_points:
#   start_research:
#     task_type: research_console
#     description: Start a conversation about a research request.
#     prompt_template: prompts/blank.md
#     worktree: inherit
#     system: false
#   research_console:
#     description: Discuss a research question.
#     prompt_template: prompts/blank.md
## cydo-init: complete-example end

## ===========================================================================
## Singletons
## ===========================================================================

## singletons
## Purpose: Defines named tasks started on demand through Request.
## Type: Mapping from singleton names to singleton settings.
## Default: Retains the singletons from lower layers.
## Notes: The name is the Request address and is reserved against
##   user_entry_points keys, even when disabled. CyDo reuses the newest
##   top-level task started through that entry in the caller's project and
##   workspace, excluding archived, archiving, and importable tasks.
##   If no match exists, CyDo starts one.
# singletons:
#   research_desk:
#     task_type: research_console

## ---------------------------------------------------------------------------
## Singleton fields
## ---------------------------------------------------------------------------

## task_type
## Purpose: Selects the type CyDo starts for this singleton.
## Type: Type name string.
## Default: Required for a new singleton. An overlay inherits it.
## Accepted values: An existing type, or an empty string.
## Notes: An empty effective value disables the singleton after merging.
##   The name remains reserved. A later overlay can restore it.
##   CyDo creates a same-name hidden system entry for an enabled singleton.
##   The target type's agent expression resolves against the requester.
# singletons:
#   research_desk:
#     task_type: research_console

## prompt_template
## Purpose: Wraps the startup message when CyDo creates the task.
## Type: Path string relative to defs.
## Default: Required for a new singleton. An overlay inherits it.
## Notes: Requests arrive separately via Ask. The caller waits for Answer.
# singletons:
#   research_desk:
#     prompt_template: prompts/blank.md

## title
## Purpose: Sets the initial sidebar title of a newly created task.
## Type: String.
## Default: Required for a new singleton. An overlay inherits it.
## Notes: A blank title allows normal title generation. Edits apply only
##   when a fresh singleton task starts.
# singletons:
#   research_desk:
#     title: Research Desk

## offered_to
## Purpose: Chooses which sessions may request the singleton.
## Type: Audience string.
## Default: interactive.
## Accepted values: interactive, all.
## Notes: interactive includes types started by user or system entry points
##   and types reachable from them through named keep-context transitions.
##   all also includes autonomous types. Both exclude the target type.
# singletons:
#   research_desk:
#     offered_to: all

## description
## Purpose: Tells callers what to send and what the answer means.
## Type: String.
## Default: Empty, which validation reports as a diagnostic.
## Notes: The first line is the compact Request summary. The full text goes
##   into generated guidance for sessions offered this singleton.
# singletons:
#   research_desk:
#     description: |
#       Answer research questions about the current project.
#       Send one question with relevant context. Expect a concise answer.

## ---------------------------------------------------------------------------
## Complete example
## ---------------------------------------------------------------------------

## The research_desk singleton uses research_console from the complete task
## type block above. Its own name lets it coexist with the shipped integrator.

## cydo-init: complete-example begin
# singletons:
#   research_desk:
#     task_type: research_console
#     prompt_template: prompts/blank.md
#     title: Research Desk
#     offered_to: interactive
#     description: |
#       Answer research questions about the current project.
#       Send one question, with relevant paths and context if available.
#       Expect a concise answer with supporting findings or open questions.
## cydo-init: complete-example end
