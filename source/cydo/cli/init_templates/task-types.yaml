#     serial: false
#     max_turns: 12
#     agent: "{{ parent_agent_type }}"
#     memory: true

#   approval_steward:
#     icon: steward-quality
#     agent_description: Review a proposed transition.
#     tool_guidance: Choose this role for a quality review.
#     prompt_template: prompts/blank.md
