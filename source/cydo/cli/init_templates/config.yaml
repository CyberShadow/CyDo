## cydo-init: complete-example begin
# task_dir: "{{ workspace_root }}/.cydo/tasks/{{ tid }}"
# default_agent: claude
# default_task_type: direct
# suggestions: false
# dev_mode: false
# log_level: info
# system_keyword: SYSTEM
# ui:
#   usage:
#     coloring: pace
#     remaining: false
#   sidebar:
#     order: oldest_first
#     sort: creation
# disk_cleanup_threshold_bytes: 10485760
## cydo-init: complete-example end
